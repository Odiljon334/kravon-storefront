<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Void Sequence | KRAVØN</title>
  <meta name="description" content="Requested coordinate does not exist in the KRAVØN neural archive.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-wrapper {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-size: 72px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #00e5ff;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    .error-title {
      font-size: 20px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .error-desc {
      color: #8b92a2;
      font-size: 14px;
      max-width: 440px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-home {
      display: inline-block;
      background: #00e5ff;
      color: #000000;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .btn-home:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand-logo">KRAVØN</a>
    </div>
  </header>

  <main class="error-wrapper">
    <div class="error-code">404</div>
    <h1 class="error-title">Void Coordinate Sequence</h1>
    <p class="error-desc">The archival catalog sector you are attempting to address has either been de-indexed or relocated.</p>
    <a href="/" class="btn-home">Return to Archive Index</a>
  </main>
</body>
</html>
