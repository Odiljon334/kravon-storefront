<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRAVØN — Experimental Objects & Artifacts</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="container nav-inner">
      <a href="/" class="brand-logo">KRAVØN</a>

      <nav class="category-nav">
        <button class="cat-btn active" data-category="All">All Items</button>
        <button class="cat-btn" data-category="Cyberpunk Gear">Cyberpunk</button>
        <button class="cat-btn" data-category="Techwear">Techwear</button>
        <button class="cat-btn" data-category="Apparel">Apparel</button>
        <button class="cat-btn" data-category="Artifacts">Artifacts</button>
      </nav>

      <div class="nav-actions">
        <select id="currencySelect" class="currency-select">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>

        <button id="bagTriggerBtn" class="bag-btn">
          Bag <span id="bagCountBadge" class="bag-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-quiet">
      <h1 class="hero-title">Experimental archive.</h1>
      <p class="hero-desc">Unclassified artifacts, rare physical objects and unpredictable editions.</p>
    </section>

    <div id="catalogGrid" class="catalog-grid"></div>
  </main>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="cartDrawer" class="cart-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Bag</h3>
      <button id="drawerCloseBtn" class="btn-add" style="padding: 4px 10px; font-size: 11px;">Close</button>
    </div>

    <div class="free-ship-box">
      <div id="freeShipText">Complimentary shipping on orders over $200.</div>
      <div class="ship-progress-bar">
        <div id="freeShipFill" class="ship-progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <div id="drawerItems" class="drawer-items"></div>

    <div id="checkoutFormSection" class="checkout-form-section">
      <div class="form-header-badge">DESTINATION · YETKAZIB BERISH MANZILI</div>
      <div class="input-grid">
        <input type="text" id="custName" class="form-field" placeholder="To'liq ism (Full Name)*" required>
        <input type="email" id="custEmail" class="form-field" placeholder="Email pochta*" required>
        <input type="text" id="custPhone" class="form-field" placeholder="Telefon raqami*" required>
        <select id="custCountry" class="form-field">
          <option value="US">United States (AQSH)</option>
          <option value="GB">United Kingdom (Buyuk Britaniya)</option>
          <option value="DE">Germany (Germaniya)</option>
          <option value="FR">France (Fransiya)</option>
          <option value="CH">Switzerland (Shveysariya)</option>
          <option value="UZ">Uzbekistan (O'zbekiston)</option>
          <option value="AE">UAE / Dubai (BAA)</option>
        </select>
        <input type="text" id="custAddress" class="form-field full-width" placeholder="Ko'cha va uy manzili (Street Address)*" required>
        <input type="text" id="custCity" class="form-field" placeholder="Shahar (City)*" required>
        <input type="text" id="custProvince" class="form-field" placeholder="Viloyat / Shtat (State/Province)*" required>
        <input type="text" id="custZip" class="form-field" placeholder="Pochta indeksi (Postal Code)*" required>
      </div>

      <div class="form-header-badge" style="margin-top: 14px;">PAYMENT · KARTA TO'LOVI</div>
      <div class="card-input-box">
        <input type="text" id="cardNumber" class="form-field full-width" placeholder="Karta raqami: 4000 1234 5678 9010" maxlength="19">
        <div class="sub-row">
          <input type="text" id="cardExpiry" class="form-field" placeholder="MM / YY" maxlength="5">
          <input type="text" id="cardCvc" class="form-field" placeholder="CVC" maxlength="4">
        </div>
      </div>
    </div>

    <div class="drawer-footer">
      <div class="coupon-row">
        <input type="text" id="couponInput" class="coupon-input" placeholder="Coupon (VIP10)">
        <button id="applyCouponBtn" class="btn-coupon">Apply</button>
      </div>

      <div class="ledger-group">
        <div class="ledger-line">
          <span>Subtotal</span>
          <span id="ledgerSubtotal">$0.00</span>
        </div>
        <div class="ledger-line">
          <span>Discount</span>
          <span id="ledgerDiscount" style="color: var(--accent-gold);">$0.00</span>
        </div>
        <div class="ledger-line total">
          <span>Total</span>
          <span id="ledgerTotal">$0.00</span>
        </div>
      </div>

      <button id="checkoutBtn" class="btn-checkout-now">
        Proceed to Checkout
      </button>
    </div>
  </aside>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close-btn">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
